name: Seed Contract

# 서버(get_seed_data)의 실제 응답이 클라이언트 DTO와 맞고 데이터 정합성을 만족하는지 확인한다.
# 시드의 원본이 서버라서, 서버 데이터가 바뀌면 앱 코드와 무관하게 깨질 수 있다.
# - pull_request: 시드 수신 코드나 이 테스트를 바꿀 때만 실행한다.
# - schedule: 서버 데이터가 바뀐 경우를 잡기 위해 매일 한 번 실행한다.
on:
  pull_request:
    paths:
      - "Projects/Data/Sources/Seed/**"
      - "Projects/Data/Tests/SeedServerContractTests.swift"
      - ".github/workflows/seed-contract.yml"
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

concurrency:
  group: seed-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-contract:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: mise 설치
        uses: jdx/mise-action@v2

      - name: Secrets.xcconfig 생성
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
        run: |
          # xcconfig에서 //가 주석으로 처리되지 않도록 https:/$()/ 형식으로 변환
          XCCONFIG_URL=$(printf '%s' "$SUPABASE_PROD_URL" | sed 's#://#:/$()/#')
          cat > Projects/App/Secrets.xcconfig << EOF2
          SUPABASE_ANON_KEY = ${{ secrets.SUPABASE_ANON_KEY }}
          MW_DICTIONARY_API_KEY = ${{ secrets.MW_DICTIONARY_API_KEY }}
          SUPABASE_PROD_URL = ${XCCONFIG_URL}
          EOF2

      - name: tuist install & generate
        run: |
          tuist install
          tuist generate --no-open

      - name: 서버 계약 테스트
        env:
          # xcodebuild는 TEST_RUNNER_ 접두사 환경변수만 테스트 프로세스로 전달한다.
          TEST_RUNNER_SEED_CONTRACT: "1"
        run: |
          set -o pipefail
          tuist test Data --no-selective-testing -- \
            -only-testing:DataTests/SeedServerContractTests 2>&1 | tee $RUNNER_TEMP/seed-contract.log

      - name: 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-contract-log
          path: ${{ runner.temp }}/seed-contract.log
          if-no-files-found: ignore
