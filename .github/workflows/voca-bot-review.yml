name: agent-vovo PR review

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions: {}

concurrency:
  group: voca-bot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target checks out the trusted default branch. Never check out the PR head.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create voca-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VOCA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VOCA_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Review pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          OPENAI_API_KEY: ${{ secrets.VOCA_BOT_OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.VOCA_BOT_MODEL || 'gpt-4.1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/voca_bot/review.py
